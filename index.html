<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WHB手记</title>
  <!-- 网站图标，引用你上传的 couple.png -->
  <link rel="icon" type="image/png" href="./couple.png">
  <!-- 社交分享预览图 -->
  <meta property="og:image" content="./couple.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Noto Serif SC"', 'serif'],
            sans: ['"Noto Sans SC"', 'sans-serif'],
          },
          colors: {
            dark: '#222222',
          }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .item-fade {
        opacity: 0;
        transform: translateY(12px);
        transition: all 0.6s ease-out;
      }
      .item-fade.active {
        opacity: 1;
        transform: translateY(0);
      }
      .work-hover {
        transition: transform 0.3s ease;
      }
      .work-hover:hover {
        transform: translateX(6px);
      }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="bg-white text-dark min-h-screen px-6 md:px-16 lg:px-32 py-16">
  <header class="mb-20 item-fade">
    <h1 class="text-4xl md:text-5xl font-serif font-semibold">WHB</h1>
    <p class="mt-3 text-gray-500 text-lg">手记 | 个人作品存档，持续迭代中</p>
    <hr class="mt-6 border-gray-200">
  </header>

  <main class="space-y-16">
    <!-- 作品1 -->
    <div class="item-fade work-hover">
      <span class="text-sm text-gray-400">2026 <span class="border border-gray-200 px-1 py-0.5 ml-1">设计</span></span>
      <h2 class="text-2xl font-serif mt-2">极简字母标识</h2>
      <p class="text-gray-500 mt-2">基于几何与留白的 WHB 字母标识探索。</p>
    </div>
    <!-- 作品2 -->
    <div class="item-fade work-hover">
      <span class="text-sm text-gray-400">2026 <span class="border border-gray-200 px-1 py-0.5 ml-1">开发</span></span>
      <h2 class="text-2xl font-serif mt-2">个人站点原型</h2>
      <p class="text-gray-500 mt-2">轻量静态网页，探索最少代码表达最清晰阅读体验。</p>
    </div>
    <!-- 作品3 -->
    <div class="item-fade work-hover">
      <span class="text-sm text-gray-400">2025 <span class="border border-gray-200 px-1 py-0.5 ml-1">实验</span></span>
      <h2 class="text-2xl font-serif mt-2">排版练习集</h2>
      <p class="text-gray-500 mt-2">中文字体排印实验，字距行距与留白的关系。</p>
    </div>
  </main>

  <footer class="mt-32 pt-8 border-t border-gray-200 text-gray-400 text-sm">
    © 2026 WHB手记 | wuhaibo.com.cn
  </footer>

  <!-- 滚动淡入动画脚本 -->
  <script>
    const items = document.querySelectorAll('.item-fade');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if(entry.isIntersecting){
          entry.target.classList.add('active');
        }
      })
    }, { threshold: 0.1 });
    items.forEach(el => observer.observe(el));
  </script>
</body>
</html>
